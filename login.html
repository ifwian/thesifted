<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | The Sifted Cafe</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#eadec7">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="The Sifted Cafe, home">
        <img src="assets/logo-wordmark.png" alt="the sifted" width="700" height="186">
        <span class="brand-tag">cafe &amp; bakery</span>
      </a>
      <a class="auth-back" href="index.html">&larr; Back to home</a>
    </div>
  </header>

  <main id="main" class="auth-main">
    <section class="auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title">Log in</h1>
      <p class="auth-intro">Welcome back. Log in to reserve a table and see your reservations.</p>
      <div id="auth-status" class="form-status" aria-live="polite"></div>
      <form id="signin-form" class="auth-form" novalidate>
      <div class="field">
        <label for="signin-email">Email</label>
        <input id="signin-email" type="email" autocomplete="email" required aria-describedby="err-signin-email">
        <p class="field-error" id="err-signin-email" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="signin-password">Password</label>
        <div class="pw-wrap">
          <input id="signin-password" type="password" autocomplete="current-password" required aria-describedby="err-signin-password">
          <button type="button" class="pw-toggle" data-toggle-password="signin-password" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <p class="field-error" id="err-signin-password" aria-live="polite"></p>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="signin-submit">Log in</button>
      <p class="auth-demo">Demo account: <strong>demo@siftedcafe.test</strong> / <strong>demo1234</strong></p>
      </form>
      <p class="auth-switch">No account yet? <a href="signup.html" id="to-signup">Sign up</a></p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/demo-api.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
